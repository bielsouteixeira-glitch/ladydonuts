# Configuração de publicação no Netlify
# Build: Vite gera a pasta "dist" (index.html + /images de contingência).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cabeçalhos de cache para as cópias locais das fotografias
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
